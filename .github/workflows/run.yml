name: Build FreeBSD amd64 TUN

on:
  push:
    branches: [master, 'codex/**']
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebsd-amd64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Prepare pinned sources and apply FreeBSD TUN patches
        run: scripts/prepare.sh
      - uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: freebsd-amd64-${{ runner.os }}-${{ hashFiles('.go-version', 'build.env', 'patches/**', '.build/sing-box/go.sum') }}
      - name: Build FreeBSD x86-64 binary
        run: scripts/build.sh
      - name: Verify target and archive
        run: |
          file dist/bsd-box-freebsd-amd64 | tee dist/file.txt
          grep -q 'ELF 64-bit.*x86-64.*FreeBSD' dist/file.txt
          xz --test dist/bsd-box-freebsd-amd64.xz
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-freebsd-amd64-tun
          path: |
            dist/bsd-box-freebsd-amd64.xz
            dist/SHA256SUMS
            dist/build-info.txt
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-freebsd-amd64-tun
          path: dist
      - name: Start all TUN stacks on FreeBSD amd64
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          arch: amd64
          run: sh scripts/smoke-freebsd.sh

  release:
    needs: [build, smoke]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: sing-box-freebsd-amd64-tun
          path: dist
      - name: Read release version
        run: |
          source build.env
          echo "RELEASE_TAG=v${SING_BOX_VERSION}-freebsd-amd64-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Publish FreeBSD amd64 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "sing-box ${RELEASE_TAG} (FreeBSD x86-64 TUN)" --notes-file dist/build-info.txt
          fi
